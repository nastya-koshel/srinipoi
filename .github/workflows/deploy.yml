name: Go App Pipeline
on:
  push:
    branches: [ main, develop ]
jobs:
  build-and-deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v3
      - name: Build
        run: docker build -t go-demo-app:latest .
      - name: Remove old container
        run: |
          docker stop go-app-instance || true
          docker rm go-app-instance || true
      - name: Run
        run: docker run -d --name go-app-instance -p 8888:8888 go-demo-app:latest
      - name: Health check
        run: |
          sleep 3
          curl -f http://localhost:8888/health
